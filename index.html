<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#fffaf8;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:380px;
    text-align:center;
}

.tag{
    display:inline-block;
    background:#fff;
    color:#d96d8b;
    border-radius:30px;
    padding:8px 18px;
    font-size:12px;
    letter-spacing:2px;
    box-shadow:0 4px 10px rgba(0,0,0,.08);
}
button{
margin-top:30px;

padding:15px 40px;

font-size:18px;

border:none;

border-radius:30px;

background:light yellow;

color:red;

cursor:pointer;
}
button:hover{

background:light yellow;
}

h1{
    margin-top:20px;
    font-size:42px;
    color:#222;
}

.sub{
    font-family:'Dancing Script',cursive;
    color:#ff6b8b;
    font-size:35px;
    margin-bottom:25px;
}

.video{
    width:120px;
    height:120px;
    margin:auto;
    border-radius:50%;
    overflow:hidden;
    position:relative;
}

.video img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.play{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:45px;
    height:45px;
    border-radius:50%;
    background:white;
    color:black;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:18px;
}

.envelope{
    width:220px;
    margin:60px auto 10px;
    cursor:pointer;
}

.envelope img{
    width:100%;
}

.tap{
    font-size:12px;
    color:#888;
    letter-spacing:2px;
}

</style>
</head>
<body>


<div class="container">

<div class="tag">
💗 MADE WITH SO MUCH LOVE
</div>

<h1>Hello Kiiwiiii</h1>

<div class="sub">
happy birthday ♡
</div>

<div class="video">

<img src="cu.jpg">
</div>



<button id="next" onclick="window.location.href='birthday.html'">
<br>
<br>

Open Your suprise

</button>




</body>
</html>
