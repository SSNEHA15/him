
<!DOCTYPE html>
<html>

<head>

<title>For You 💌</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background-image:url("le.jpg");

background-size:cover;

background-position:center;

background-repeat:no-repeat;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

font-family:Georgia,serif;

}

.box{

width:700px;

padding:40px;

background:rgba(255,255,255,.20);

backdrop-filter:blur(12px);

border-radius:25px;

text-align:center;

color:pink;

box-shadow:0 0 25px rgba(255,255,255,.4);

}

h1{

font-size:45px;

margin-bottom:20px;

}

p{

font-size:20px;

margin-bottom:20px;

}

video{

width:420px;

border-radius:20px;

box-shadow:0 0 20px white;

}

button{

margin-top:30px;

padding:15px 40px;

font-size:18px;

border:none;

border-radius:30px;

background:#ff69b4;

color:white;

cursor:pointer;

}

button:hover{

background:#ff1493;

}

</style>

</head>

<body>

<div class="box">

<h1>💌 A Little Something For You 💌</h1>

<p></p>

<video autoplay controls>

<source src="letter.mp4" type="video/mp4">

</video>

<audio autoplay loop>

<source src="happybirthday.mp3" type="audio/mp3">

</audio>

<br>

<button onclick="window.location.href='song.html'">

</button>

</div>

</body>

</html>
